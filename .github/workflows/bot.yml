name: Did we score 31?

on:
  schedule:
    # Every 15 minutes, every day. Each run just reads NC State's schedule
    # from ESPN and only tweets about finished games not in posted.json,
    # so non-game days do nothing.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Mark games already played as posted (no tweets)"
        type: boolean
        default: false
      skip_before:
        description: "Mark games before this date (YYYY-MM-DD) as posted, tweet the rest"
        type: string
        default: ""
      dry_run:
        description: "Print tweets instead of posting them"
        type: boolean
        default: false

permissions:
  contents: write

# Only one run at a time, so two runs can never tweet the same game.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check out the latest main rather than the commit that triggered the
      # run, so a queued run sees posted.json as saved by the run before it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >-
          python bot.py
          ${{ inputs.backfill && '--backfill' || '' }}
          ${{ inputs.skip_before && format('--skip-before {0}', inputs.skip_before) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          TEAM_ID: ${{ vars.TEAM_ID || '152' }}  # 152 = NC State
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: Save posted games
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Record posted games"
          # Retry so a push race can't lose the record (which would re-tweet).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
