name: Did we score 31?

on:
  schedule:
    # Every 30 minutes, Thursday through Sunday (UTC), covering game days.
    - cron: "*/30 * * * 4,5,6,0"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Mark games already played as posted (no tweets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ inputs.backfill && '--backfill' || '' }}
        env:
          TEAM_ID: ${{ vars.TEAM_ID || '152' }}  # 152 = NC State
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: Save posted games
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Record posted games" && git push)
