name: Did we score 31?

on:
  # Automatic schedule turned off (bot stopped). To turn it back on, restore:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Mark games already played as posted (no tweets)"
        type: boolean
        default: false
      skip_before:
        description: "Mark games before this date (YYYY-MM-DD) as posted, tweet the rest"
        type: string
        default: ""
      announce:
        description: "Post the one-time sign-off announcement with its photo"
        type: boolean
        default: false
      dry_run:
        description: "Print tweets instead of posting them"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # lets a game-day run hand off to a fresh run

# Only one run at a time, so two runs can never tweet the same game.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Check out the latest main rather than the commit that triggered the
      # run, so a queued run sees posted.json as saved by the run before it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Normal runs use --watch: on game days they keep checking every few
      # minutes from noon to 2 AM ET instead of exiting.
      - id: bot
        run: >-
          python bot.py
          ${{ inputs.backfill && '--backfill' || '' }}
          ${{ inputs.skip_before && format('--skip-before {0}', inputs.skip_before) || '' }}
          ${{ inputs.announce && '--announce' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ !(inputs.backfill || inputs.skip_before || inputs.dry_run || inputs.announce) && '--watch' || '' }}
        env:
          TEAM_ID: ${{ vars.TEAM_ID || '152' }}  # 152 = NC State
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: Save posted games
        if: always()
        run: bash save_state.sh
      # Runs are capped at 6 hours, so a game day is covered by a chain of runs.
      - name: Hand off to a fresh run
        if: steps.bot.outputs.continue == 'true'
        run: gh workflow run bot.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
